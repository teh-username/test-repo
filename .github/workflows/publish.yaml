name: publish
on: {push: {branches: [master]}}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.11", "3.12"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/cache@v4
        with: {path: ~/.cache/pip, key: "pip-${{ matrix.python }}-${{ hashFiles('requirements.txt') }}"}
      - run: pip install -r requirements.txt && python -c "print('ok ${{ matrix.python }}')"
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with: {images: "ghcr.io/${{ github.repository }}"}
      - id: push
        uses: docker/build-push-action@v6
        with: {context: ., file: Dockerfile.slim, push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}"}